site_name: CanetaForma
site_url: https://docshopfono.github.io/CanetaForma/

theme:
  name: material
  language: pt-BR

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed

nav:
  - Início: index.md
  - Instalação: instalacao.md
  - Uso: uso.md
